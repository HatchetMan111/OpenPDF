# systemd-Drop-in für nginx.service — gepusht vom Installer nach
# /etc/systemd/system/nginx.service.d/openpdfstudio.conf
#
# Der CT startet automatisch (onboot=1); nginx als Web-UI-Service ist damit
# reboot-sicher: enabled + Restart bei Absturz + erst nach online Netzwerk.

[Unit]
Wants=network-online.target
After=network-online.target

[Service]
Restart=on-failure
RestartSec=3
